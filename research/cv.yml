experience:
  - title: Staff Radar Engineer
    org: Capella Space / IonQ
    location: Louisville, CO / San Francisco, CA
    start: "10/2025"
    end: present
    bullets:
      - Oversaw product launch and application development of first commercial InSAR offering.
      - Developed real-time/onboard GPU-compatible SAR and InSAR algorithms.
  - title: Signal Analysis Engineer
    org: NASA Jet Propulsion Laboratory
    location: Pasadena, CA
    start: "06/2022"
    end: "10/2025"
    bullets:
      - Led the Algorithm Development Team for the OPERA Sentinel-1 North American Surface Displacement product, the largest public InSAR-derived ground displacement data set.
      - Architected and deployed scalable cloud infrastructure using AWS Batch to process hundreds of terabytes of Sentinel-1 SAR data, enabling automated InSAR time series analysis across North America with robust production-ready software.
      - Managed cross-functional collaboration between Algorithm Development, Project Science, and Software Data System teams while directing 6 team members, overseeing multi-product budgets, and ensuring on-time delivery of project milestones.
  - title: Graduate Research Assistant, Radar Interferometry Group
    org: Dept. of Aerospace Engineering & Engineering Mechanics, University of Texas at Austin
    location: Austin, TX
    start: "09/2017"
    end: "08/2022"
    bullets:
      - Generated a new surface deformation data set with millimeter-level accuracy and 100-meter spatial resolution over the entirety of West Texas.
      - Developed a new method for mitigating atmospheric noise in Interferometric Synthetic Aperture Radar (InSAR) data.
      - Created a computer vision algorithm for automatic detection of InSAR surface deformation signals.
      - Implemented open source tools in Python and Julia for InSAR data processing.
  - title: Summer Internship Program (SIP) Intern
    org: NASA Jet Propulsion Laboratory
    location: Pasadena, CA
    start: "05/2021"
    end: "09/2021"
    bullets:
      - Analyzed radar acquisition modes for the upcoming NISAR mission using UAVSAR data simulations.
      - Quantified impact on InSAR-derived subsidence, flooding, and infrastructure monitoring applications.
      - Developed and optimized open-source processing chain for future NISAR data products.
  - title: Development Manager, Senior Quantitative Analyst
    org: Cogo Labs
    location: Cambridge, MA
    start: "06/2014"
    end: "06/2017"
    bullets:
      - Architected Python codebase for marketing campaigns generating $700k+ in monthly revenue.
      - Managed team of 6, developed team strategy with CEO and executive board.
      - Analyzed large-scale (10s of TB) datasets in SQL, Spark, and MapReduce.
  - title: Electrical Engineer
    org: The MITRE Corporation
    location: Bedford, MA
    start: "07/2013"
    end: "05/2014"
    bullets:
      - Created algorithms to combine multiple sensors using Kalman filtering for robust navigation.
      - Published two technical reports on signal processing features of GPS receivers.
      - Designed experiments to test robustness of GNSS equipment under varying interference conditions.

